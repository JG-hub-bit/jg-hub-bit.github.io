<title>K-Fortune Story | 개인정보처리방침</title>
<style>
:root{
  color-scheme:light dark;
  --hanji:#F6F0E3;
  --meok:#2B2620;
  --noeurok:#2E6B5E;
  --noeurok-deep:#1E4634;
  --samcheong:#2C4E8A;
  --jinsa:#C23B22;
  --hwang:#E8A93D;
  --bunhong:#D9738C;
  --seokganju:#8A4A34;
  --seokganju-dark:#6E3A28;
  --stone:#B9B2A4;
  --stone-dark:#8F887B;
  --gold-line:#C9A85C;
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px}
body{
  font-family:'Gowun Batang',serif;
  background:#F6F0E3;
  background:var(--hanji);
  color:var(--meok);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow-x:hidden;
}

/* ── 좌우 기둥 ── */
body::before, body::after{
  content:"";
  position:fixed; top:0; bottom:0;
  width:clamp(10px, 3vw, 34px);
  background:linear-gradient(90deg,
    var(--seokganju-dark) 0%, var(--seokganju) 30%,
    #A05A40 50%, var(--seokganju) 70%, var(--seokganju-dark) 100%);
  box-shadow:inset 0 0 18px rgba(0,0,0,.25);
  z-index:5;
}
body::before{left:0}
body::after{right:0}

/* ── 지붕(단청 처마) ── */
.roof{position:relative; z-index:4;}
.roof svg{display:block; width:100%; height:auto;}

/* ── 호랑이 ── */
.tiger{
  position:absolute;
  top:100px;
  top:8.5vw;
  right:30px;
  right:clamp(14px, 4vw, 52px);
  height:150px;
  height:clamp(64px, 13.5vw, 240px);
  width:auto;
  z-index:6;
  pointer-events:none;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.3));
  image-rendering:auto;
}
@media (max-width:560px){
  .tiger{top:6vw; height:64px; height:clamp(48px, 15vw, 84px);}
}

/* ── 상단 바 (언어 토글: 좌측 상단) ── */
.topbar{position:absolute; top:10px; left:clamp(20px,5vw,50px); z-index:10;}
.lang-toggle{
  display:inline-flex; border:2px solid var(--gold-line);
  border-radius:999px; overflow:hidden; background:rgba(43,38,32,.55);
  backdrop-filter:blur(2px);
  font-family:'Noto Sans KR',sans-serif; font-size:.8rem; font-weight:700;
}
.lang-toggle button{
  border:none; background:transparent; color:#EFE6D0;
  padding:.35rem .85rem; cursor:pointer; transition:.2s;
}
.lang-toggle button.active{background:var(--gold-line); color:var(--meok);}

/* ── 본문 ── */
main{
  flex:1; width:100%; max-width:920px;
  margin:0 auto;
  padding:2.2rem clamp(28px,7vw,60px) 3rem;
  text-align:center;
}
.eyebrow{
  font-family:'Noto Sans KR',sans-serif;
  letter-spacing:.35em; font-size:.72rem; font-weight:500;
  color:var(--seokganju); text-transform:uppercase;
  margin-bottom:.7rem;
}
h1{
  font-family:'Song Myung',serif;
  font-size:clamp(1.9rem, 6vw, 3.1rem);
  line-height:1.25; color:var(--meok);
}
h1 .accent{color:var(--jinsa);}
.subtitle{
  margin-top:.9rem;
  font-size:clamp(.95rem, 2.6vw, 1.08rem);
  color:#5A5245; line-height:1.7;
}
.visitor{
  margin:1.6rem auto 0; display:inline-block;
  font-family:'Noto Sans KR',sans-serif;
  font-size:.85rem; color:#6B6353;
  border-top:1px solid var(--gold-line);
  border-bottom:1px solid var(--gold-line);
  padding:.5rem 1.4rem;
}
.visitor b{color:var(--jinsa); font-weight:700;}

/* ── 운세 메뉴: PC 3열 고정 ── */
.menu-title{
  margin:2.6rem 0 1.3rem;
  font-family:'Song Myung',serif;
  font-size:clamp(.95rem, 3.4vw, 1.15rem);
  color:var(--noeurok);
  display:flex; align-items:center; gap:10px; justify-content:center;
  white-space:nowrap;
}
.menu-title::before, .menu-title::after{
  content:""; height:1px; background:var(--gold-line);
  flex:0 1 56px; min-width:10px;
}
.menu-grid{
  display:flex; flex-direction:column;
  gap:12px; max-width:540px; margin:0 auto;
}
.menu-btn{
  border:1.5px solid #E4D9BF; background:#FFFDF7;
  border-radius:16px; padding:.95rem 1.15rem;
  cursor:pointer;
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
  transition:transform .15s, box-shadow .15s, border-color .15s;
  font-family:'Gowun Batang',serif;
  text-align:left;
}
.menu-btn:hover, .menu-btn:focus-visible{
  transform:translateY(-2px);
  border-color:var(--hwang);
  box-shadow:0 6px 16px rgba(138,74,52,.15);
  outline:none;
}
.menu-btn .mtext{display:flex; flex-direction:column; gap:.28rem; flex:1; min-width:0;}
.menu-btn .emblem{width:54px; height:54px; flex:0 0 54px;}
.menu-btn .name{font-size:1.08rem; font-weight:700; color:var(--meok); line-height:1.3;}
.menu-btn .desc{
  font-family:'Noto Sans KR',sans-serif;
  font-size:.82rem; color:#6E6656; line-height:1.45;
}

/* ── 토스트 ── */
.toast{
  position:fixed; left:50%; bottom:90px;
  transform:translateX(-50%) translateY(20px);
  background:var(--meok); color:#F3EBD9;
  font-family:'Noto Sans KR',sans-serif; font-size:.85rem;
  padding:.65rem 1.3rem; border-radius:999px;
  opacity:0; pointer-events:none; transition:.3s; z-index:50;
  white-space:nowrap;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ── 하단 돌기단 ── */
footer{
  position:relative; z-index:4;
  background:linear-gradient(180deg, var(--stone) 0%, var(--stone-dark) 100%);
  padding:1.1rem 0 .9rem; text-align:center;
}
footer::before{
  content:""; display:block;
  position:absolute; top:-8px; left:0; right:0; height:8px;
  background:repeating-linear-gradient(90deg,
    var(--stone-dark) 0 46px, #A39C8E 46px 48px);
}
footer p{
  font-family:'Noto Sans KR',sans-serif;
  font-size:.72rem; color:#3E3A32; letter-spacing:.05em;
}

/* ── 모바일 보정 ── */
@media (max-width:560px){
  .menu-btn{padding:.85rem 1rem;}
  .menu-btn .emblem{width:48px; height:48px; flex-basis:48px;}
  .menu-btn .name{font-size:1.08rem;}
  .menu-btn .desc{font-size:.86rem;}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;}
}

@media (max-width:560px){ .vs{grid-template-columns:1fr;} }
</style>

<script>
const DOC_KR = '<h1>개인정보처리방침</h1>\n<p class="lead">K-Fortune Story는 <b>로그인 없이도 모든 운세를 무료로</b> 쓸 수 있고, 이때 입력하신 정보는 계산에만 쓰고 저장하지 않습니다. <b>선택해서 계정을 만들 때만</b> 아래 정보를 저장하며, 언제든 내려받거나 지울 수 있습니다.</p>\n\n<div class="card">\n  <h2>1. 핵심 요약</h2>\n  <ul>\n    <li>로그인하지 않고 운세를 보면, 입력하신 생년월일 등은 <b>계산하는 순간에만</b> 서버로 전송되고 저장되지 않습니다.</li>\n    <li>계정(선택)을 만들면 이메일 주소와 <b>"내 사람들"에 저장한 정보</b>를 보관합니다. 운세 계산과 이용자가 켠 알림에만 씁니다.</li>\n    <li>개인정보를 <b>팔거나 광고 목적으로 제공하지 않습니다</b>.</li>\n    <li>계정 화면에서 언제든 <b>내 데이터 내려받기</b>와 <b>계정 삭제</b>를 할 수 있습니다.</li>\n  </ul>\n</div>\n\n<div class="card">\n  <h2>2. 로그인 없이 이용할 때</h2>\n  <p>이름(선택), 성별, 생년월일, 양력/음력, 태어난 시간(선택), 태어난 나라·지역(선택), 궁합 상대 정보(선택), 꿈 내용(선택)을 입력하실 수 있습니다. 이 정보는 암호화된 통신(HTTPS)으로 서버에 전송되어 결과를 계산한 뒤 <b>저장하지 않습니다</b>.</p>\n  <p>재방문 편의를 위해 입력값과 언어 설정이 <b>이용자의 브라우저(로컬 저장소)</b>에 남을 수 있으며, 운영자는 이를 볼 수 없습니다. 입력 화면의 초기화 버튼이나 브라우저의 사이트 데이터 삭제로 지울 수 있습니다.</p>\n  <p>서비스 개선을 위해 <b>운세 종류별·국가별 이용 횟수</b>만 숫자로 집계합니다. 이 집계에는 개인을 알아볼 수 있는 정보가 들어가지 않습니다.</p>\n</div>\n\n<div class="card">\n  <h2>3. 계정을 만들 때 저장하는 정보</h2>\n  <ul>\n    <li><b>로그인 정보</b>: 이메일 주소. Google·카카오·네이버·Apple로 로그인하면 해당 서비스가 주는 고유번호와 이메일 주소(받는 경우). 비밀번호, 연락처, 친구 목록은 받지 않습니다.</li>\n    <li><b>내 사람들</b>(본인 포함 최대 5명): 이름 또는 별명, 관계, 생년월일, 양력/음력, 성별(선택), 태어난 시간(선택), 태어난 나라·도시(선택).</li>\n    <li><b>설정</b>: 언어, 알림 수신 여부, 푸시 알림 주소(브라우저가 만든 수신 주소이며 기기 고유번호가 아닙니다).</li>\n    <li><b>기록</b>: 가입 시각, 연령 확인·약관 동의 시각.</li>\n    <li><b>쿠키</b>: 로그인 유지용 <code>kf_sess</code> 쿠키 1개(필수, 최대 30일). 광고나 추적에 쓰지 않습니다.</li>\n  </ul>\n</div>\n\n<div class="card">\n  <h2>4. 다른 사람의 정보</h2>\n  <p>"내 사람들"에 다른 사람을 저장하려면 <b>그 사람에게 동의를 받았다는 확인</b>이 필요합니다. 실명 대신 별명을 쓰셔도 됩니다. 본인 정보가 동의 없이 저장되었다고 생각되면 아래 문의처로 알려주세요. 확인 후 지체 없이 삭제합니다.</p>\n</div>\n\n<div class="card">\n  <h2>5. 이용 목적</h2>\n  <ul>\n    <li>운세 계산과 결과 표시</li>\n    <li>"오늘 반짝이는 사람" 표시</li>\n    <li>이용자가 직접 켠 알림(이메일·푸시) 발송</li>\n    <li>로그인 유지와 부정 이용 방지(로그인 링크 발송 횟수 제한 등)</li>\n  </ul>\n  <p>위 목적 외에는 쓰지 않으며, 맞춤 광고나 판매에 쓰지 않습니다.</p>\n</div>\n\n<div class="card">\n  <h2>6. 처리를 맡기는 곳과 국외 이전</h2>\n  <p>서비스 운영을 위해 아래 업체가 정보를 처리합니다. 계정 정보는 아래 업체의 해외 서버에 저장·처리될 수 있으며, 가입 시점부터 계정 삭제 시까지 보관됩니다.</p>\n  <ul>\n    <li><b>Cloudflare, Inc.</b> (미국 및 전 세계 데이터센터) — 서버 실행과 계정 정보 저장 (모든 항목)</li>\n    <li><b>Resend, Inc.</b> (미국) — 로그인 링크·알림·칼럼 메일 발송 (이메일 주소, 메일 내용)</li>\n    <li><b>웹 푸시 서비스</b> (Google·Apple·Mozilla 등, 이용자 브라우저에 따라) — 알림 신호 전달 (푸시 수신 주소만, 알림 내용은 보내지 않음)</li>\n    <li><b>Google·Kakao·NAVER·Apple</b> — 해당 방식으로 로그인할 때만 로그인 처리</li>\n    <li><b>MET Norway</b> (노르웨이) — 날씨 표시용. Cloudflare가 추정한 대략적인 위치(약 1km 단위 좌표)만 보내며, 이용자 계정과 연결되지 않습니다.</li>\n  </ul>\n</div>\n\n<div class="card">\n  <h2>7. 매일 운세 칼럼 구독</h2>\n  <p>칼럼 구독을 신청하시면 <b>이메일 주소</b>를 구독 해지 시까지 보관합니다. 모든 메일 하단의 해지 링크로 언제든 해지할 수 있고, 해지하면 즉시 삭제됩니다.</p>\n</div>\n\n<div class="card">\n  <h2>8. 광고</h2>\n  <p>본 서비스는 <b>카카오 애드핏</b>을 통한 광고를 게재합니다. 광고 사업자인 카카오는 쿠키를 사용하여 이전 방문 기록을 바탕으로 광고를 게재할 수 있으며, 이는 카카오의 개인정보처리방침을 따릅니다. 운영자는 광고 사업자가 수집하는 정보에 접근할 수 없습니다. 브라우저 설정에서 쿠키를 거부하거나 삭제하면 맞춤 광고를 제한할 수 있고, 운세 기능은 그대로 쓸 수 있습니다.</p>\n</div>\n\n<div class="card">\n  <h2>9. 보관 기간과 파기</h2>\n  <ul>\n    <li>계정 정보: 계정을 삭제할 때까지. 삭제하면 즉시 지워지며, 다른 기기의 로그인 상태도 함께 무효가 됩니다.</li>\n    <li>로그인 링크: 15분 / 로그인 유지 쿠키: 최대 30일 / 오늘의 알림 문구: 2일</li>\n    <li>로그인 없이 입력한 정보: 저장하지 않음</li>\n  </ul>\n</div>\n\n<div class="card">\n  <h2>10. 아동의 개인정보</h2>\n  <p>계정은 <b>만 14세 이상</b>(유럽연합 거주자는 만 16세 이상)만 만들 수 있습니다. 가입할 때 나이를 확인하며, 본인 생년월일이 만 14세 미만이면 저장하지 않습니다. 이 기준에 맞지 않는 계정을 알게 되면 삭제합니다.</p>\n</div>\n\n<div class="card">\n  <h2>11. 이용자의 권리</h2>\n  <ul>\n    <li><b>열람·정정</b>: 계정 화면("내 사람들")에서 바로 확인하고 고칠 수 있습니다.</li>\n    <li><b>내려받기</b>: 계정 화면의 "내 데이터 내려받기"(JSON 파일).</li>\n    <li><b>삭제·동의 철회</b>: 계정 화면의 "계정 삭제". 알림은 언제든 끌 수 있습니다.</li>\n    <li>그 밖의 요청은 아래 문의처로 보내주시면 지체 없이 처리합니다.</li>\n  </ul>\n  <p>유럽연합·영국 거주자의 경우, 계정 정보는 서비스 제공(계약 이행), 알림은 이용자 동의, 보안 조치는 정당한 이익을 근거로 처리하며, 거주 국가 감독기관에 이의를 제기할 권리가 있습니다.</p>\n</div>\n\n<div class="card">\n  <h2>12. 안전성 확보 조치</h2>\n  <ul>\n    <li>모든 통신 HTTPS 암호화</li>\n    <li>비밀번호를 받거나 보관하지 않음 (메일 링크·소셜 로그인 방식)</li>\n    <li>로그인 쿠키는 HttpOnly·Secure·SameSite 설정</li>\n    <li>운영자 외 접근 권한 제한</li>\n  </ul>\n</div>\n\n<div class="card">\n  <h2>13. 방침의 변경</h2>\n  <p>방침이 바뀌면 이 페이지에 공지하며, 바뀐 방침은 게시일부터 적용됩니다. 중요한 변경은 계정 이메일로도 알려드립니다.</p>\n</div>\n\n<div class="card">\n  <h2>14. 문의 (개인정보 보호책임자)</h2>\n  <p>개인정보 처리에 관한 문의·요청은 아래로 연락해 주세요.</p>\n  <p><b>이메일 : contact@kfortunestory.com</b></p>\n</div>\n\n<p class="upd">시행일: 2026년 10월 5일</p>';
const DOC_EN = '<h1>Privacy Policy</h1>\n<p class="lead">You can use every reading on K-Fortune Story <b>for free without signing in</b>, and what you type is used only for the calculation, then discarded. We store the information below <b>only if you choose to create an account</b>, and you can download or delete it at any time.</p>\n\n<div class="card">\n  <h2>1. Summary</h2>\n  <ul>\n    <li>Without an account, your birth details are sent to our server <b>only for the moment of calculation</b> and are not stored.</li>\n    <li>With an account (optional), we keep your email address and <b>the people you save</b>, and use them only for readings and the notifications you turn on.</li>\n    <li>We <b>never sell</b> your information or share it for advertising.</li>\n    <li>You can <b>download your data</b> or <b>delete your account</b> from the account page at any time.</li>\n  </ul>\n</div>\n\n<div class="card">\n  <h2>2. Using the Service without an account</h2>\n  <p>You may enter a name (optional), gender, birth date, solar or lunar calendar, birth time (optional), birth country and place (optional), a partner\'s details (optional), or a dream. This is sent over HTTPS to calculate your reading and is <b>not stored</b>.</p>\n  <p>For convenience, your inputs and language may be kept <b>in your own browser</b> (local storage). We cannot see them. Clear them with the Reset button or your browser\'s site-data settings.</p>\n  <p>To improve the Service we count <b>how many readings of each type and from which country</b>. These counts contain no information that identifies you.</p>\n</div>\n\n<div class="card">\n  <h2>3. What we store when you create an account</h2>\n  <ul>\n    <li><b>Sign-in details</b>: your email address. If you sign in with Google, Kakao, NAVER or Apple, the ID they give us and, if provided, your email. We never receive passwords, contacts or friend lists.</li>\n    <li><b>My People</b> (up to 5 including you): name or nickname, relationship, birth date, solar or lunar calendar, gender (optional), birth time (optional), birth country and city (optional).</li>\n    <li><b>Settings</b>: language, notification choices, and push subscription addresses (created by your browser; not a device ID).</li>\n    <li><b>Records</b>: when you signed up and when you confirmed your age and agreed to the terms.</li>\n    <li><b>Cookie</b>: one sign-in cookie, <code>kf_sess</code> (essential, up to 30 days). It is not used for ads or tracking.</li>\n  </ul>\n</div>\n\n<div class="card">\n  <h2>4. Other people\'s information</h2>\n  <p>To save someone else in My People you must confirm <b>that they agreed</b>. A nickname is fine; real names are not required. If you believe your details were saved without your agreement, contact us and we will delete them promptly.</p>\n</div>\n\n<div class="card">\n  <h2>5. Why we use it</h2>\n  <ul>\n    <li>Calculating and showing readings</li>\n    <li>Showing who is "glowing today"</li>\n    <li>Sending the notifications you turned on (email, push)</li>\n    <li>Keeping you signed in and preventing abuse (for example, limiting sign-in emails)</li>\n  </ul>\n  <p>We do not use it for anything else, including targeted advertising or sale.</p>\n</div>\n\n<div class="card">\n  <h2>6. Service providers and international transfers</h2>\n  <p>These providers process data for us. Account data may be stored and processed on their servers outside your country, from sign-up until you delete your account.</p>\n  <ul>\n    <li><b>Cloudflare, Inc.</b> (USA and data centers worldwide): running the Service and storing account data (all items)</li>\n    <li><b>Resend, Inc.</b> (USA): sending sign-in links, notifications and the daily column (email address, message content)</li>\n    <li><b>Web push services</b> (Google, Apple, Mozilla and others, depending on your browser): delivering a notification signal (push address only; we send no message content)</li>\n    <li><b>Google, Kakao, NAVER, Apple</b>: signing you in, only if you choose that option</li>\n    <li><b>MET Norway</b> (Norway): weather for your area. We send only an approximate location estimated by Cloudflare (about 1 km), not linked to your account.</li>\n  </ul>\n</div>\n\n<div class="card">\n  <h2>7. Daily column emails</h2>\n  <p>If you subscribe to the daily column, we keep your <b>email address</b> until you unsubscribe. Every email has an unsubscribe link, and unsubscribing deletes it immediately.</p>\n</div>\n\n<div class="card">\n  <h2>8. Advertising</h2>\n  <p>The Service shows ads through <b>Kakao AdFit</b>. Kakao may use cookies to show ads based on your previous visits, under Kakao\'s own privacy policy. We have no access to what the ad provider collects. You can limit personalised ads by blocking or clearing cookies; every reading keeps working.</p>\n</div>\n\n<div class="card">\n  <h2>9. Retention</h2>\n  <ul>\n    <li>Account data: until you delete your account. Deletion is immediate and also signs out your other devices.</li>\n    <li>Sign-in links: 15 minutes. Sign-in cookie: up to 30 days. Today\'s notification text: 2 days.</li>\n    <li>Details entered without an account: not stored.</li>\n  </ul>\n</div>\n\n<div class="card">\n  <h2>10. Children</h2>\n  <p>Accounts are only for people <b>14 or older</b> (16 or older in the European Union). We ask you to confirm your age, and we do not save your own birth date if it shows you are under 14. We delete accounts that we learn do not meet this rule.</p>\n</div>\n\n<div class="card">\n  <h2>11. Your rights</h2>\n  <ul>\n    <li><b>Access and correction</b>: view and edit everything on the My People page.</li>\n    <li><b>Portability</b>: "Download my data" on the account page (JSON).</li>\n    <li><b>Deletion and withdrawal of consent</b>: "Delete account" on the account page. You can turn notifications off at any time.</li>\n    <li>For anything else, contact us and we will respond promptly.</li>\n  </ul>\n  <p>If you are in the EU or UK: we process account data to provide the Service (contract), notifications on your consent, and security measures on our legitimate interest. You may complain to your local data protection authority.</p>\n</div>\n\n<div class="card">\n  <h2>12. Security</h2>\n  <ul>\n    <li>HTTPS for all traffic</li>\n    <li>No passwords received or stored (email links and social sign-in only)</li>\n    <li>Sign-in cookie is HttpOnly, Secure and SameSite</li>\n    <li>Access limited to the operator</li>\n  </ul>\n</div>\n\n<div class="card">\n  <h2>13. Changes</h2>\n  <p>We will post changes on this page, effective from the date posted. We will also email account holders about significant changes.</p>\n</div>\n\n<div class="card">\n  <h2>14. Contact</h2>\n  <p>For any privacy question or request, contact:</p>\n  <p><b>Email: contact@kfortunestory.com</b></p>\n</div>\n\n<p class="upd">Effective: October 5, 2026</p>';
</script>
<script>
const LANG = (function(){
  const s = localStorage.getItem("kf_lang");
  if(s === "kr" || s === "en") return s;
  const ls = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || "en"];

})();

document.getElementById("doc").innerHTML = K ? DOC_KR : DOC_EN;
