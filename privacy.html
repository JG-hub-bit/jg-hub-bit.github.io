<style>
:root{
  color-scheme:light dark;
  --hanji:#F6F0E3;
  --meok:#2B2620;
  --noeurok:#2E6B5E;
  --noeurok-deep:#1E4634;
  --samcheong:#2C4E8A;
  --jinsa:#C23B22;
  --hwang:#E8A93D;
  --bunhong:#D9738C;
  --seokganju:#8A4A34;
  --seokganju-dark:#6E3A28;
  --stone:#B9B2A4;
  --stone-dark:#8F887B;
  --gold-line:#C9A85C;
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px}
body{
  font-family:'Gowun Batang',serif;
  background:#F6F0E3;
  background:var(--hanji);
  color:var(--meok);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow-x:hidden;
}

/* ── 좌우 기둥 ── */
body::before, body::after{
  content:"";
  position:fixed; top:0; bottom:0;
  width:clamp(10px, 3vw, 34px);
  background:linear-gradient(90deg,
    var(--seokganju-dark) 0%, var(--seokganju) 30%,
    #A05A40 50%, var(--seokganju) 70%, var(--seokganju-dark) 100%);
  box-shadow:inset 0 0 18px rgba(0,0,0,.25);
  z-index:5;
}
body::before{left:0}
body::after{right:0}

/* ── 지붕(단청 처마) ── */
.roof{position:relative; z-index:4;}
.roof svg{display:block; width:100%; height:auto;}

/* ── 호랑이 ── */
.tiger{
  position:absolute;
  top:100px;
  top:8.5vw;
  right:30px;
  right:clamp(14px, 4vw, 52px);
  height:150px;
  height:clamp(64px, 13.5vw, 240px);
  width:auto;
  z-index:6;
  pointer-events:none;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.3));
  image-rendering:auto;
}
@media (max-width:560px){
  .tiger{top:6vw; height:64px; height:clamp(48px, 15vw, 84px);}
}

/* ── 상단 바 (언어 토글: 좌측 상단) ── */
.topbar{position:absolute; top:10px; left:clamp(20px,5vw,50px); z-index:10;}
.lang-toggle{
  display:inline-flex; border:2px solid var(--gold-line);
  border-radius:999px; overflow:hidden; background:rgba(43,38,32,.55);
  backdrop-filter:blur(2px);
  font-family:'Noto Sans KR',sans-serif; font-size:.8rem; font-weight:700;
}
.lang-toggle button{
  border:none; background:transparent; color:#EFE6D0;
  padding:.35rem .85rem; cursor:pointer; transition:.2s;
}
.lang-toggle button.active{background:var(--gold-line); color:var(--meok);}

/* ── 본문 ── */
main{
  flex:1; width:100%; max-width:920px;
  margin:0 auto;
  padding:2.2rem clamp(28px,7vw,60px) 3rem;
  text-align:center;
}
.eyebrow{
  font-family:'Noto Sans KR',sans-serif;
  letter-spacing:.35em; font-size:.72rem; font-weight:500;
  color:var(--seokganju); text-transform:uppercase;
  margin-bottom:.7rem;
}
h1{
  font-family:'Song Myung',serif;
  font-size:clamp(1.9rem, 6vw, 3.1rem);
  line-height:1.25; color:var(--meok);
}
h1 .accent{color:var(--jinsa);}
.subtitle{
  margin-top:.9rem;
  font-size:clamp(.95rem, 2.6vw, 1.08rem);
  color:#5A5245; line-height:1.7;
}
.visitor{
  margin:1.6rem auto 0; display:inline-block;
  font-family:'Noto Sans KR',sans-serif;
  font-size:.85rem; color:#6B6353;
  border-top:1px solid var(--gold-line);
  border-bottom:1px solid var(--gold-line);
  padding:.5rem 1.4rem;
}
.visitor b{color:var(--jinsa); font-weight:700;}

/* ── 운세 메뉴: PC 3열 고정 ── */
.menu-title{
  margin:2.6rem 0 1.3rem;
  font-family:'Song Myung',serif;
  font-size:clamp(.95rem, 3.4vw, 1.15rem);
  color:var(--noeurok);
  display:flex; align-items:center; gap:10px; justify-content:center;
  white-space:nowrap;
}
.menu-title::before, .menu-title::after{
  content:""; height:1px; background:var(--gold-line);
  flex:0 1 56px; min-width:10px;
}
.menu-grid{
  display:flex; flex-direction:column;
  gap:12px; max-width:540px; margin:0 auto;
}
.menu-btn{
  border:1.5px solid #E4D9BF; background:#FFFDF7;
  border-radius:16px; padding:.95rem 1.15rem;
  cursor:pointer;
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
  transition:transform .15s, box-shadow .15s, border-color .15s;
  font-family:'Gowun Batang',serif;
  text-align:left;
}
.menu-btn:hover, .menu-btn:focus-visible{
  transform:translateY(-2px);
  border-color:var(--hwang);
  box-shadow:0 6px 16px rgba(138,74,52,.15);
  outline:none;
}
.menu-btn .mtext{display:flex; flex-direction:column; gap:.28rem; flex:1; min-width:0;}
.menu-btn .emblem{width:54px; height:54px; flex:0 0 54px;}
.menu-btn .name{font-size:1.08rem; font-weight:700; color:var(--meok); line-height:1.3;}
.menu-btn .desc{
  font-family:'Noto Sans KR',sans-serif;
  font-size:.82rem; color:#6E6656; line-height:1.45;
}

/* ── 토스트 ── */
.toast{
  position:fixed; left:50%; bottom:90px;
  transform:translateX(-50%) translateY(20px);
  background:var(--meok); color:#F3EBD9;
  font-family:'Noto Sans KR',sans-serif; font-size:.85rem;
  padding:.65rem 1.3rem; border-radius:999px;
  opacity:0; pointer-events:none; transition:.3s; z-index:50;
  white-space:nowrap;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ── 하단 돌기단 ── */
footer{
  position:relative; z-index:4;
  background:linear-gradient(180deg, var(--stone) 0%, var(--stone-dark) 100%);
  padding:1.1rem 0 .9rem; text-align:center;
}
footer::before{
  content:""; display:block;
  position:absolute; top:-8px; left:0; right:0; height:8px;
  background:repeating-linear-gradient(90deg,
    var(--stone-dark) 0 46px, #A39C8E 46px 48px);
}
footer p{
  font-family:'Noto Sans KR',sans-serif;
  font-size:.72rem; color:#3E3A32; letter-spacing:.05em;
}

/* ── 모바일 보정 ── */
@media (max-width:560px){
  .menu-btn{padding:.85rem 1rem;}
  .menu-btn .emblem{width:48px; height:48px; flex-basis:48px;}
  .menu-btn .name{font-size:1.08rem;}
  .menu-btn .desc{font-size:.86rem;}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;}
}

@media (max-width:560px){ .vs{grid-template-columns:1fr;} }
</style>

<script>
const DOC_KR = '<h1>개인정보처리방침</h1>\n<p class="lead">K-Fortune Story는 입력하신 정보를 <b>계산 목적으로만, 잠시</b> 사용하며, 저장하거나 축적하지 않습니다.</p>\n\n<div class="card">\n  <h2>1. 핵심 요약</h2>\n  <ul>\n    <li>본 서비스는 <b>회원가입이 없으며</b>, 이용자를 식별할 수 있는 계정 정보를 만들지 않습니다.</li>\n    <li>운세 계산을 위해 입력하신 이름·생년월일·시간 등은 <b>계산이 이루어지는 짧은 순간 동안만 서버로 전송</b>되며, 결과를 돌려드린 뒤 <b>서버에 저장되거나 기록되지 않습니다</b>.</li>\n    <li>서버는 데이터베이스에 이용자 정보를 남기지 않는 무상태(stateless) 방식으로 동작합니다.</li>\n    <li>브라우저에도 일부 정보(재방문 편의를 위한 값, 언어 설정 등)가 저장되며, 이는 이용자가 언제든 직접 지울 수 있습니다.</li>\n  </ul>\n</div>\n\n<div class="card">\n  <h2>2. 수집하는 정보와 처리 방식</h2>\n  <h3>이용자가 직접 입력하는 정보</h3>\n  <p>이름(선택), 성별, 생년월일, 태어난 시간(선택), 태어난 지역(선택), 궁합 상대의 정보(선택), 꿈 내용(선택).</p>\n  <p>이 정보는 운세 결과를 계산하기 위해 <b>암호화된 통신(HTTPS)으로 서버에 전송</b>됩니다. 계산은 Cloudflare의 서버리스 컴퓨팅 서비스(Cloudflare Workers) 위에서 이루어지며, 계산이 끝나면 결과만 이용자에게 돌려드리고 <b>입력하신 정보는 서버 어디에도 저장되지 않습니다</b>. 별도의 데이터베이스나 로그에 이름·생년월일 등을 남기지 않습니다.</p>\n  <p>브라우저에는 재방문 시 다시 입력하는 번거로움을 덜기 위해 일부 값이 로컬 저장소(local storage)에 보관될 수 있습니다. 이는 이용자의 기기 안에만 있으며, 운영자가 열람할 수 없습니다.</p>\n  <h3>자동으로 처리되는 정보</h3>\n  <p>일부 결과 화면에는 방문자 수를 집계하기 위해 외부 카운팅 서비스에 <b>숫자를 1 증가시키는 요청</b>만 보냅니다. 이 요청에는 이름·생년월일 등 개인을 식별할 수 있는 정보가 포함되지 않습니다.</p>\n  <p>이용자가 선택한 언어(한국어/English) 설정이 브라우저에 저장됩니다.</p>\n</div>\n\n<div class="card">\n  <h2>3. 서버(Cloudflare Workers)에 대한 안내</h2>\n  <p>운세 계산의 일부는 Cloudflare, Inc.가 제공하는 서버리스 컴퓨팅 인프라 위에서 처리됩니다. 이 처리는 요청 하나에 대해 계산하고 응답하는 순간에만 이루어지며(무상태 처리), 본 서비스는 이 과정에서 입력값을 별도로 저장·기록·재사용하지 않습니다.</p>\n  <p>다만 통신 인프라의 특성상 Cloudflare가 표준적인 네트워크 운영 목적(보안, 트래픽 관리 등)으로 요청 정보를 일시적으로 처리할 수 있으며, 이는 Cloudflare의 자체 개인정보처리방침을 따릅니다.</p>\n</div>\n\n<div class="card">\n  <h2>4. 광고 및 쿠키</h2>\n  <p>본 서비스는 <b>Google AdSense</b> 및 <b>카카오 애드핏</b>을 통한 광고를 게재합니다.</p>\n  <ul>\n    <li>Google, 카카오를 포함한 제3자 광고 사업자는 <b>쿠키를 사용</b>하여 이용자의 이전 방문 기록을 바탕으로 광고를 게재할 수 있습니다.</li>\n    <li>Google이 광고 쿠키를 사용함으로써, Google과 그 파트너는 이용자의 본 사이트 및 다른 사이트 방문 기록을 바탕으로 광고를 게재할 수 있습니다.</li>\n    <li>이용자는 <b>광고 설정</b>(google.com/settings/ads)에서 맞춤 광고를 해제할 수 있습니다.</li>\n    <li>또는 <b>aboutads.info</b>에서 제3자 업체의 맞춤 광고 쿠키 사용을 해제할 수 있습니다.</li>\n  </ul>\n  <p>광고 사업자가 수집하는 정보는 해당 사업자의 개인정보처리방침을 따르며, 본 서비스 운영자는 이에 접근할 수 없습니다.</p>\n</div>\n\n<div class="card">\n  <h2>5. 정보의 보관 및 파기</h2>\n  <p>운세 계산을 위해 서버로 전송된 정보는 계산 즉시 폐기되며 별도로 보관되지 않습니다. 브라우저에 저장된 정보는 이용자의 기기에만 있으므로, 운영자가 별도로 보관하거나 파기할 정보가 존재하지 않습니다.</p>\n  <p>브라우저에 저장된 정보를 삭제하시려면 다음 중 한 가지를 하시면 됩니다.</p>\n  <ul>\n    <li>입력 화면의 <b>초기화</b> 버튼을 누릅니다.</li>\n    <li>브라우저 설정에서 <b>인터넷 사용 기록 / 쿠키 및 사이트 데이터 삭제</b>를 실행합니다.</li>\n  </ul>\n</div>\n\n<div class="card">\n  <h2>6. 아동의 개인정보</h2>\n  <p>본 서비스는 만 14세 미만 아동을 대상으로 하지 않으며, 아동의 개인정보를 의도적으로 수집하지 않습니다.</p>\n</div>\n\n<div class="card">\n  <h2>7. 이용자의 권리</h2>\n  <p>본 서비스는 이용자를 식별할 수 있는 정보를 서버에 보관하지 않으므로, 열람·정정·삭제 요청의 대상이 되는 보관 정보가 없습니다. 브라우저에 남은 정보에 대한 통제권은 전적으로 이용자에게 있습니다.</p>\n</div>\n\n<div class="card">\n  <h2>8. 방침의 변경</h2>\n  <p>본 방침이 변경될 경우 이 페이지를 통해 공지하며, 변경된 방침은 게시일부터 적용됩니다.</p>\n</div>\n\n<div class="card">\n  <h2>9. 문의</h2>\n  <p>개인정보 처리에 관한 문의는 아래로 연락해 주시기 바랍니다.</p>\n  <p><b>이메일 : contact@kfortunestory.com</b></p>\n</div>\n<p class="upd">시행일: 2026년 8월 23일</p>';
const DOC_EN = '<h1>Privacy Policy</h1>\n<p class="lead">K-Fortune Story uses the information you enter <b>only briefly, to perform a calculation</b> \u2014 it is never stored or retained.</p>\n\n<div class="card">\n  <h2>1. In Short</h2>\n  <ul>\n    <li>This service has <b>no accounts</b> and creates no identifiable user profile.</li>\n    <li>To calculate your reading, information such as name, birth date and time is <b>transmitted briefly to a server</b> for the moment the calculation runs, then the result is returned and <b>nothing is stored or logged</b>.</li>\n    <li>The server operates statelessly \u2014 it does not write your information to any database.</li>\n    <li>Some values (for convenience on return visits, and your language setting) are also saved in your own browser, which you can clear at any time.</li>\n  </ul>\n</div>\n\n<div class="card">\n  <h2>2. Information We Handle</h2>\n  <h3>Information you enter</h3>\n  <p>Name (optional), gender, date of birth, time of birth (optional), birthplace (optional), a compatibility partner\'s details (optional), and dream descriptions (optional).</p>\n  <p>This information is sent to our server over an <b>encrypted connection (HTTPS)</b> solely to calculate your reading. Calculation runs on Cloudflare\'s serverless computing platform (Cloudflare Workers); once the result is returned, <b>your input is not stored anywhere on the server</b> \u2014 no database or log retains your name, birth date, or similar details.</p>\n  <p>Some values may also be saved in your browser\'s local storage purely to spare you re-entering them on a return visit. This stays on your device and is not accessible to the operator.</p>\n  <h3>Information handled automatically</h3>\n  <p>Certain result pages send a request to an external counting service that does nothing but <b>increment a number by one</b>, to display a visitor count. No personally identifying information is included.</p>\n  <p>Your language preference (Korean/English) is saved in your browser.</p>\n</div>\n\n<div class="card">\n  <h2>3. About Our Server (Cloudflare Workers)</h2>\n  <p>Part of the fortune calculation runs on serverless computing infrastructure provided by Cloudflare, Inc. This processing happens only for the moment needed to compute and return a single response (stateless processing); this service does not separately store, log, or reuse your input during this process.</p>\n  <p>As is standard for network infrastructure, Cloudflare may briefly process request data for its own operational purposes (security, traffic management, etc.), governed by Cloudflare\'s own privacy policy.</p>\n</div>\n\n<div class="card">\n  <h2>4. Advertising and Cookies</h2>\n  <p>This service displays advertising through <b>Google AdSense</b> and <b>Kakao AdFit</b>.</p>\n  <ul>\n    <li>Third-party vendors, including Google and Kakao, <b>use cookies</b> to serve ads based on your prior visits to this or other websites.</li>\n    <li>Google\'s use of advertising cookies enables Google and its partners to serve ads to you based on your visit to this site and/or other sites on the Internet.</li>\n    <li>You may opt out of personalised advertising by visiting <b>Ads Settings</b> (google.com/settings/ads).</li>\n    <li>You may also opt out of third-party vendors\' use of cookies for personalised advertising at <b>aboutads.info</b>.</li>\n  </ul>\n  <p>Any information collected by advertising vendors is governed by their own privacy policies, and the operator of this site has no access to it.</p>\n</div>\n\n<div class="card">\n  <h2>5. Retention and Deletion</h2>\n  <p>Information sent to the server for calculation is discarded immediately and not separately retained. Information stored in your browser stays on your device, so there is nothing further for the operator to retain or delete.</p>\n  <p>To erase what is stored in your browser, do either of the following:</p>\n  <ul>\n    <li>Press the <b>Reset</b> button on the input screen.</li>\n    <li>Clear <b>cookies and site data</b> in your browser settings.</li>\n  </ul>\n</div>\n\n<div class="card">\n  <h2>6. Children\'s Privacy</h2>\n  <p>This service is not directed to children under 14 and does not knowingly collect information from them.</p>\n</div>\n\n<div class="card">\n  <h2>7. Your Rights</h2>\n  <p>As this service does not retain information capable of identifying you on its server, there is no stored data subject to access, correction or deletion requests. Control over anything remaining in your browser rests entirely with you.</p>\n</div>\n\n<div class="card">\n  <h2>8. Changes to This Policy</h2>\n  <p>Any changes will be posted on this page and take effect from the date of posting.</p>\n</div>\n\n<div class="card">\n  <h2>9. Contact</h2>\n  <p>For questions about privacy, please contact:</p>\n  <p><b>Email: contact@kfortunestory.com</b></p>\n</div>\n<p class="upd">Effective: August 23, 2026</p>';
</script>
