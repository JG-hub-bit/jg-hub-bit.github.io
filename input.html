<style>
:root{
  color-scheme:light dark;
  --hanji:#F6F0E3;
  --meok:#2B2620;
  --noeurok:#2E6B5E;
  --noeurok-deep:#1E4634;
  --samcheong:#2C4E8A;
  --jinsa:#C23B22;
  --hwang:#E8A93D;
  --bunhong:#D9738C;
  --seokganju:#8A4A34;
  --seokganju-dark:#6E3A28;
  --stone:#B9B2A4;
  --stone-dark:#8F887B;
  --gold-line:#C9A85C;
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px}
body{
  font-family:'Gowun Batang',serif;
  background:#F6F0E3;
  background:var(--hanji);
  color:var(--meok);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow-x:hidden;
}

/* ── 좌우 기둥 ── */
body::before, body::after{
  content:"";
  position:fixed; top:0; bottom:0;
  width:clamp(10px, 3vw, 34px);
  background:linear-gradient(90deg,
    var(--seokganju-dark) 0%, var(--seokganju) 30%,
    #A05A40 50%, var(--seokganju) 70%, var(--seokganju-dark) 100%);
  box-shadow:inset 0 0 18px rgba(0,0,0,.25);
  z-index:5;
}
body::before{left:0}
body::after{right:0}

/* ── 지붕(단청 처마) ── */
.roof{position:relative; z-index:4;}
.roof svg{display:block; width:100%; height:auto;}

/* ── 호랑이 ── */
.tiger{
  position:absolute;
  top:100px;
  top:8.5vw;
  right:30px;
  right:clamp(14px, 4vw, 52px);
  height:150px;
  height:clamp(64px, 13.5vw, 240px);
  width:auto;
  z-index:6;
  pointer-events:none;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.3));
  image-rendering:auto;
}
@media (max-width:560px){
  .tiger{top:6vw; height:64px; height:clamp(48px, 15vw, 84px);}
}

/* ── 상단 바 (언어 토글: 좌측 상단) ── */
.topbar{position:absolute; top:10px; left:clamp(20px,5vw,50px); z-index:10;}
.lang-toggle{
  display:inline-flex; border:2px solid var(--gold-line);
  border-radius:999px; overflow:hidden; background:rgba(43,38,32,.55);
  backdrop-filter:blur(2px);
  font-family:'Noto Sans KR',sans-serif; font-size:.8rem; font-weight:700;
}
.lang-toggle button{
  border:none; background:transparent; color:#EFE6D0;
  padding:.35rem .85rem; cursor:pointer; transition:.2s;
}
.lang-toggle button.active{background:var(--gold-line); color:var(--meok);}

/* ── 본문 ── */
main{
  flex:1; width:100%; max-width:920px;
  margin:0 auto;
  padding:2.2rem clamp(28px,7vw,60px) 3rem;
  text-align:center;
}
.eyebrow{
  font-family:'Noto Sans KR',sans-serif;
  letter-spacing:.35em; font-size:.72rem; font-weight:500;
  color:var(--seokganju); text-transform:uppercase;
  margin-bottom:.7rem;
}
h1{
  font-family:'Song Myung',serif;
  font-size:clamp(1.9rem, 6vw, 3.1rem);
  line-height:1.25; color:var(--meok);
}
h1 .accent{color:var(--jinsa);}
.subtitle{
  margin-top:.9rem;
  font-size:clamp(.95rem, 2.6vw, 1.08rem);
  color:#5A5245; line-height:1.7;
}
.visitor{
  margin:1.6rem auto 0; display:inline-block;
  font-family:'Noto Sans KR',sans-serif;
  font-size:.85rem; color:#6B6353;
  border-top:1px solid var(--gold-line);
  border-bottom:1px solid var(--gold-line);
  padding:.5rem 1.4rem;
}
.visitor b{color:var(--jinsa); font-weight:700;}

/* ── 운세 메뉴: PC 3열 고정 ── */
.menu-title{
  margin:2.6rem 0 1.3rem;
  font-family:'Song Myung',serif;
  font-size:1.15rem; color:var(--noeurok);
  display:flex; align-items:center; gap:14px; justify-content:center;
}
.menu-title::before, .menu-title::after{
  content:""; height:1px; width:56px; background:var(--gold-line);
}
.menu-grid{
  display:flex; flex-direction:column;
  gap:12px; max-width:540px; margin:0 auto;
}
.menu-btn{
  border:1.5px solid #E4D9BF; background:#FFFDF7;
  border-radius:16px; padding:.95rem 1.15rem;
  cursor:pointer;
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
  transition:transform .15s, box-shadow .15s, border-color .15s;
  font-family:'Gowun Batang',serif;
  text-align:left;
}
.menu-btn:hover, .menu-btn:focus-visible{
  transform:translateY(-2px);
  border-color:var(--hwang);
  box-shadow:0 6px 16px rgba(138,74,52,.15);
  outline:none;
}
.menu-btn .mtext{display:flex; flex-direction:column; gap:.28rem; flex:1; min-width:0;}
.menu-btn .emblem{width:54px; height:54px; flex:0 0 54px;}
.menu-btn .name{font-size:1.15rem; font-weight:700; color:var(--meok); line-height:1.3;}
.menu-btn .desc{
  font-family:'Noto Sans KR',sans-serif;
  font-size:.9rem; color:#6E6656; line-height:1.45;
}

/* ── 토스트 ── */
.toast{
  position:fixed; left:50%; bottom:90px;
  transform:translateX(-50%) translateY(20px);
  background:var(--meok); color:#F3EBD9;
  font-family:'Noto Sans KR',sans-serif; font-size:.85rem;
  padding:.65rem 1.3rem; border-radius:999px;
  opacity:0; pointer-events:none; transition:.3s; z-index:50;
  white-space:nowrap;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ── 하단 돌기단 ── */
footer{
  position:relative; z-index:4;
  background:linear-gradient(180deg, var(--stone) 0%, var(--stone-dark) 100%);
  padding:1.1rem 0 .9rem; text-align:center;
}
footer::before{
  content:""; display:block;
  position:absolute; top:-8px; left:0; right:0; height:8px;
  background:repeating-linear-gradient(90deg,
    var(--stone-dark) 0 46px, #A39C8E 46px 48px);
}
footer p{
  font-family:'Noto Sans KR',sans-serif;
  font-size:.72rem; color:#3E3A32; letter-spacing:.05em;
}

/* ── 모바일 보정 ── */
@media (max-width:560px){
  .menu-btn{padding:.85rem 1rem;}
  .menu-btn .emblem{width:48px; height:48px; flex-basis:48px;}
  .menu-btn .name{font-size:1.08rem;}
  .menu-btn .desc{font-size:.86rem;}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;}
}
</style>

<style>
/* ── 입력 화면 전용 ── */
.navrow{
  display:flex; justify-content:flex-start; align-items:center;
  max-width:540px; margin:0 auto 1.3rem;
  font-family:'Noto Sans KR',sans-serif;
}
.homelink{
  display:inline-flex; align-items:center; gap:.4rem;
  color:var(--seokganju); text-decoration:none; font-weight:700; font-size:.9rem;
  border:1.5px solid var(--gold-line); border-radius:999px;
  padding:.42rem 1.05rem; background:#FFFDF7;
}
.homelink:hover{border-color:var(--hwang);}
.ftitle{text-align:center; margin-bottom:1.4rem;}
.ftitle h1{font-size:clamp(1.6rem,5vw,2.2rem);}
.ftitle p{margin-top:.5rem; font-family:'Noto Sans KR',sans-serif; font-size:.9rem; color:#6E6656;}
.form-card{
  background:#FFFDF7; border:1.5px solid #E4D9BF; border-radius:18px;
  padding:1.5rem 1.4rem; text-align:left; max-width:540px; margin:0 auto;
  box-shadow:0 4px 14px rgba(138,74,52,.07);
}
.person-block h3{
  font-family:'Song Myung',serif; font-size:1.05rem; color:var(--noeurok);
  border-bottom:1.5px solid var(--gold-line); padding-bottom:.4rem; margin:1.2rem 0 1rem;
}
.person-block:first-child h3{margin-top:0;}
.field{margin-bottom:1.05rem;}
.field > label{
  display:block; font-family:'Noto Sans KR',sans-serif;
  font-size:.86rem; font-weight:700; color:#6B5B3E; margin-bottom:.42rem;
}
.field input[type=text], .field input[type=date], .field select, .field textarea{
  width:100%; max-width:100%; min-width:0; box-sizing:border-box;
  -webkit-appearance:none; appearance:none;
  padding:.72rem .85rem;

.field textarea{min-height:110px; resize:vertical;}
.region-2{display:flex; gap:.5rem;}
.region-2 select{flex:1; min-width:0;}
.fhelp{font-family:'Noto Sans KR',sans-serif; font-size:.74rem; color:#8A8171; margin-top:.32rem; line-height:1.5;}
.field input:focus, .field select:focus, .field textarea:focus{
  outline:none; border-color:var(--hwang);
}
.radiorow{display:flex; gap:.6rem;}
.radiorow.col{flex-direction:column;}
.radiorow label{
  flex:1; border:1.5px solid #D8CCAE; border-radius:10px;
  padding:.62rem .4rem; text-align:center; cursor:pointer;
  font-family:'Noto Sans KR',sans-serif; font-size:.95rem; background:#FFF;
}
.radiorow input{display:none;}
.radiorow label.sel{
  border-color:var(--jinsa); background:#FBEFE9; color:var(--jinsa); font-weight:700;
}
.btnrow{display:flex; gap:12px; max-width:540px; margin:1.5rem auto 0;}
.btn-run{
  flex:1.6; background:var(--jinsa); color:#FFF7EA;
  border:2px solid var(--gold-line); border-radius:12px;
  padding:.95rem; font-size:1.12rem; font-weight:700;
  font-family:'Gowun Batang',serif; cursor:pointer;
  transition:transform .15s, box-shadow .15s;
}
.btn-run:hover{transform:translateY(-2px); box-shadow:0 6px 14px rgba(194,59,34,.3);}
.btn-reset{
  flex:1; background:#FFFDF7; color:#6E6656;
  border:1.5px solid #D8CCAE; border-radius:12px;
  padding:.95rem; font-size:1rem; font-family:'Gowun Batang',serif; cursor:pointer;
}
.btn-reset:hover{border-color:var(--seokganju); color:var(--seokganju);}
</style>

/* ══════════ 폼 생성 ══════════ */
function fieldHTML(p, f){
  const id = p + "_" + f;
  if(f === "name")
    return '<div class="field"><label for="'+id+'">'+T.name+'</label><input type="text" id="'+id+'" placeholder="'+T.namePh+'"></div>';
  if(f === "gender")
    return '<div class="field"><label>'+T.gender+'</label><div class="radiorow" data-group="'+id+'">'
      +'<label><input type="radio" name="'+id+'" value="M"><span>'+T.male+'</span></label>'
      +'<label><input type="radio" name="'+id+'" value="F"><span>'+T.female+'</span></label></div></div>';
  if(f === "bdate")
    return '<div class="field"><label for="'+id+'">'+T.bdate+'</label><input type="date" id="'+id+'" min="1920-01-01" max="2026-12-31"></div>';
  if(f === "cal")
    return '<div class="field"><label>'+T.cal+'</label><div class="radiorow" data-group="'+id+'">'
      +'<label><input type="radio" name="'+id+'" value="solar" checked><span>'+T.solar+'</span></label>'
      +'<label><input type="radio" name="'+id+'" value="lunar"><span>'+T.lunar+'</span></label>'
      +'<label><input type="radio" name="'+id+'" value="leap"><span>'+T.leap+'</span></label></div></div>';
  if(f === "btime"){
    let opts = T.times.map((t,i)=>'<option value="'+i+'">'+t+'</option>').join("");
    return '<div class="field"><label for="'+id+'">'+T.btime+'</label><select id="'+id+'">'+opts+'</select></div>';
  }
  if(f === "lq" || f === "ev"){
    const opts = T[f === "lq" ? "loveQs" : "events"];
    const cur = params.get(f) || Object.keys(opts)[0];
    return '<div class="field"><label>'+T[f === "lq" ? "lqLabel" : "evLabel"]+'</label><div class="radiorow col" data-group="'+id+'">'
      + Object.keys(opts).map(k=>'<label><input type="radio" name="'+id+'" value="'+k+'"'+(k===cur?' checked':'')+'><span>'+opts[k]+'</span></label>').join("")
      + '</div></div>';
  }
  if(f === "tdate")
    return '<div class="field"><label for="'+id+'">'+T.tdate+'</label><input type="date" id="'+id+'"></div>';
  if(f === "trange")
    return '<div class="field"><label>'+T.trange+'</label><div class="radiorow" data-group="'+id+'">'
      +'<label><input type="radio" name="'+id+'" value="day" checked><span>'+T.rDay+'</span></label>'
      +'<label><input type="radio" name="'+id+'" value="week"><span>'+T.rWeek+'</span></label></div></div>';
  if(f === "etime")
    return '<div class="field"><label for="'+id+'">'+T.etime+'</label><input type="time" id="'+id+'">'
      +'<div class="fhelp">'+T.etimeHelp+'</div></div>';
  if(f === "region"){
    const lang = ["kr","en"].includes(localStorage.getItem("kf_lang")) ? localStorage.getItem("kf_lang") : "kr";
    let provOpts = '<option value="">'+T.provNone+'</option>';
    Object.keys(REGIONS).forEach(pk => { provOpts += '<option value="'+pk+'">'+(lang==="kr"?REGIONS[pk].kr:REGIONS[pk].en)+'</option>'; });
    return '<div class="field"><label for="'+id+'_country">'+T.region+'</label>'
      +'<select id="'+id+'_country" class="region-country"><option value="KR">'+countryName("KR")+'</option></select>'
      +'<div class="region-2" id="'+id+'_kr"><select id="'+id+'_prov" class="region-prov">'+provOpts+'</select>'
      +'<select id="'+id+'_city" class="region-city" style="display:none"></select></div>'
      +'<div class="region-2" id="'+id+'_abroad" style="display:none"><select id="'+id+'_wcity" class="region-wcity"></select></div>'
      +'<div class="fhelp">'+T.regionHelp+' · '+T.geoCredit+'</div></div>';
  }
  return "";
}

let formHTML = "";
if(cfg.dream){
  formHTML = '<div class="field"><label for="dreamText">'+T.dreamLabel+'</label>'
    +'<textarea id="dreamText" placeholder="'+T.dreamPh+'"></textarea></div>';
}else{
  cfg.persons.forEach(p=>{
    formHTML += '<div class="person-block">';
    if(cfg.persons.length > 1) formHTML += '<h3>'+(p.key==="main"?T.me:(p.optional?T.partnerOpt:T.partner))+'</h3>';
    p.fields.forEach(f=>{ formHTML += fieldHTML(p.key, f); });
    formHTML += '</div>';
  });
}
document.getElementById("formArea").innerHTML = formHTML;

/* 라디오 선택 표시 */
document.querySelectorAll('.radiorow[data-group="main_trange"]').forEach(r=>r.classList.add("col"));
document.querySelectorAll(".radiorow").forEach(row=>{
  row.querySelectorAll("input").forEach(inp=>{
    if(inp.checked) inp.closest("label").classList.add("sel");
    inp.addEventListener("change", ()=>{
      row.querySelectorAll("label").forEach(l=>l.classList.remove("sel"));
      inp.closest("label").classList.add("sel");
    });
  });
});

/* ══════════ 출생 국가 (해외는 주요 도시의 경도·시간대로 진태양시 계산) ══════════ */
function uiLang(){ return localStorage.getItem("kf_lang") === "en" ? "en" : "ko"; }
function countryName(cc){ try{ return new Intl.DisplayNames([uiLang()], {type:"region"}).of(cc); }catch(e){ return cc; } }
let WORLD = null;
function fillWorldCities(pkey, cityIdx){
  const cc = document.getElementById(pkey+"_region_country").value;
  const sel = document.getElementById(pkey+"_region_wcity");
  const list = (WORLD && WORLD[cc]) || [];
  sel.innerHTML = list.map((c,i)=>'<option value="'+i+'">'+c[0]+'</option>').join("");
  if(cityIdx !== undefined && cityIdx !== null) sel.value = String(cityIdx);
}
function showCountry(pkey){
  const cc = document.getElementById(pkey+"_region_country").value;
  document.getElementById(pkey+"_region_kr").style.display = cc === "KR" ? "" : "none";
  document.getElementById(pkey+"_region_abroad").style.display = cc === "KR" ? "none" : "";
  if(cc !== "KR") fillWorldCities(pkey);
}
document.querySelectorAll(".region-country").forEach(sel=>{
  const pkey = sel.id.replace("_region_country","");
  sel.addEventListener("change", ()=>showCountry(pkey));
});
const worldReady = document.querySelector(".region-country") ? fetch("cities.json").then(r=>r.json()).then(d=>{
  WORLD = d;
  const names = Object.keys(d).map(cc=>[cc, countryName(cc)]).sort((a,b)=>a[1].localeCompare(b[1], uiLang()));
  document.querySelectorAll(".region-country").forEach(sel=>{
    sel.innerHTML = '<option value="KR">'+countryName("KR")+'</option>' + names.map(n=>'<option value="'+n[0]+'">'+n[1]+'</option>').join("");
  });
}).catch(()=>{}) : Promise.resolve();

/* ══════════ 지역 2단계 (시도 → 시군구) ══════════ */
function fillCities(pkey, cityKey){
  const prov = document.getElementById(pkey+"_region_prov");
  const citySel = document.getElementById(pkey+"_region_city");
  if(!prov || !citySel) return;
  const pk = prov.value;
  const lang = ["kr","en"].includes(localStorage.getItem("kf_lang")) ? localStorage.getItem("kf_lang") : "kr";
  if(!pk || !REGIONS[pk]){ citySel.style.display = "none"; citySel.innerHTML = ""; return; }
  const cities = REGIONS[pk].cities;
  /* 시군구가 1개뿐(광역시)이면 굳이 안 보여줌 */
  if(cities.length <= 1){
    citySel.style.display = "none";
    citySel.innerHTML = '<option value="'+cities[0].k+'">'+(lang==="kr"?cities[0].kr:cities[0].en)+'</option>';
    citySel.value = cities[0].k;
    return;
  }
  let opts = '<option value="">'+T.cityDefault+'</option>';
  cities.forEach(c => { opts += '<option value="'+c.k+'">'+(lang==="kr"?c.kr:c.en)+'</option>'; });
  citySel.innerHTML = opts;
  citySel.style.display = "";
  if(cityKey) citySel.value = cityKey;
}
/* 시도 select에 이벤트 바인딩 */
document.querySelectorAll(".region-prov").forEach(sel=>{
  const pkey = sel.id.replace("_region_prov","");
  sel.addEventListener("change", ()=>fillCities(pkey));
});

/* ══════════ 자동 입력 (재방문 시 기억) ══════════ */
function loadProfile(pkey){
  const d = JSON.parse(localStorage.getItem("kf_p_" + pkey) || "null");
  if(!d) return;
  ["name","bdate","region","etime"].forEach(f=>{
    const el = document.getElementById(pkey+"_"+f);
    if(el && d[f]) el.value = d[f];
  });
  ["gender","cal"].forEach(f=>{
    if(!d[f]) return;
    const inp = document.querySelector('input[name="'+pkey+'_'+f+'"][value="'+d[f]+'"]');
    if(inp){ inp.checked = true; inp.dispatchEvent(new Event("change")); }
  });
  const bt = document.getElementById(pkey+"_btime");
  if(bt && d.btime) bt.value = d.btime;
  /* 지역: 저장된 시군구 키(d.region)로부터 시도를 역추적해 복원 */
  if(d.region){
    let foundProv = null;
    Object.keys(REGIONS).forEach(pk=>{
      if(REGIONS[pk].cities.some(c=>c.k===d.region)) foundProv = pk;
    });
    if(foundProv){
      const prov = document.getElementById(pkey+"_region_prov");
      if(prov){ prov.value = foundProv; fillCities(pkey, d.region); }
    }
  }
}
if(!cfg.dream) cfg.persons.forEach(p=>loadProfile(p.key));
worldReady.then(()=>{ if(!cfg.dream) cfg.persons.forEach(p=>{
  const d = JSON.parse(localStorage.getItem("kf_p_" + p.key) || "null");
  const sel = document.getElementById(p.key+"_region_country");
  if(!d || !sel || !d.country || d.country === "KR") return;
  sel.value = d.country; showCountry(p.key); fillWorldCities(p.key, d.wcity);
}); });

/* 오늘의 운세: 날짜 기본값 = 오늘 */
if(type === "today"){
  const td = document.getElementById("main_tdate");
  if(td){
    const now = new Date();
    const local = new Date(now.getTime() - now.getTimezoneOffset()*60000);
    td.value = local.toISOString().slice(0,10);
  }
  const savedRange = localStorage.getItem("kf_today_range");
  if(savedRange){
    const inp = document.querySelector('input[name="main_trange"][value="'+savedRange+'"]');
    if(inp){ inp.checked = true; inp.dispatchEvent(new Event("change")); }
  }
}

/* ══════════ 실행 / 초기화 ══════════ */
function run(){
  const qs = new URLSearchParams();
  qs.set("type", type);
  qs.set("lang", (localStorage.getItem("kf_lang") === "en") ? "en" : "kr");

  if(cfg.dream){
    const txt = document.getElementById("dreamText").value.trim();
    if(!txt){ alert(T.needDream); return; }
    localStorage.setItem("kf_dream", txt);
    qs.set("dream", txt);
  }else{
    for(const p of cfg.persons){
      const bd = document.getElementById(p.key+"_bdate").value;
      if(!bd && p.optional) continue;   /* 선택 항목(상대 생일)은 비워도 됨 */
      if(!bd){ alert(T.needBdate); return; }
      const get = id => (document.getElementById(id)||{}).value || "";
      const rad = n => (document.querySelector('input[name="'+n+'"]:checked')||{}).value || "";
      const regionVal = pk => {
        const city = (document.getElementById(pk+"_region_city")||{}).value || "";
        if(city) return city;
        const prov = (document.getElementById(pk+"_region_prov")||{}).value || "";
        /* 시군구 미선택 시: 광역시(도시1개)면 그 키, 아니면 빈값 */
        if(prov && REGIONS[prov] && REGIONS[prov].cities.length===1) return REGIONS[prov].cities[0].k;
        return "";
      };
      const country = get(p.key+"_region_country") || "KR";
      const wi = get(p.key+"_region_wcity");
      const wc = (country !== "KR" && WORLD && WORLD[country]) ? WORLD[country][+wi || 0] : null;
      const pdata = {
        name:get(p.key+"_name"), gender:rad(p.key+"_gender"),
        bdate:bd, cal:rad(p.key+"_cal"),
        btime:get(p.key+"_btime"), etime:get(p.key+"_etime"), region: wc ? "" : regionVal(p.key),
        country: country, wcity: wc ? (+wi || 0) : null
      };
      localStorage.setItem("kf_p_"+p.key, JSON.stringify(pdata));
      /* URL 파라미터로도 함께 전달 (Cloudflare Worker가 이걸 읽어 서버에서 계산함) */
      const suffix = (p.key === "main") ? "" : "2";
      qs.set("name"+suffix, pdata.name);
      qs.set("gender"+suffix, pdata.gender);
      qs.set("bdate"+suffix, pdata.bdate);
      qs.set("cal"+suffix, pdata.cal || "solar");
      qs.set("btime"+suffix, pdata.btime);
      qs.set("etime"+suffix, pdata.etime);
      qs.set("region"+suffix, pdata.region);
      if(wc){ qs.set("blon"+suffix, wc[1]); qs.set("btz"+suffix, wc[2]); qs.set("bplace"+suffix, wc[0] + ", " + country); }
    }
  }
  ["lq","ev"].forEach(f=>{ const c = document.querySelector('input[name="main_'+f+'"]:checked'); if(c) qs.set(f, c.value); });
  if(type === "today"){
    const td = document.getElementById("main_tdate");
    const rg = document.querySelector('input[name="main_trange"]:checked');
    const tdv = (td && td.value) ? td.value : "";
    const rgv = rg ? rg.value : "day";
    localStorage.setItem("kf_today_date", tdv);
    localStorage.setItem("kf_today_range", rgv);
    if(tdv) qs.set("todayDate", tdv);
    qs.set("todayRange", rgv);
  }
  localStorage.setItem("kf_selected", type);
  showWaitScreenThenGo("result.html?" + qs.toString(), 10);   /* 대기 화면(10초) 후 바로 결과로. AdSense 미사용(2026-10-03 결정)이라 ad.html 광고 게이트는 쓰지 않음 */
}
function resetForm(){
  document.querySelectorAll("#formArea input[type=text], #formArea input[type=date], #formArea textarea").forEach(el=>el.value="");
  document.querySelectorAll("#formArea select").forEach(el=>el.selectedIndex=0);
  if(!cfg.dream) cfg.persons.forEach(p=>localStorage.removeItem("kf_p_"+p.key));
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove("show"), 2400);
}
document.getElementById("btnRun").addEventListener("click", run);
document.getElementById("btnReset").addEventListener("click", resetForm);
</script>

  </div>

<script src="//t1.kakaocdn.net/kas/static/ba.min.js" async></script>
<script>
const WAIT_LABELS = {
  kr: { title:"운세를 계산하고 있어요", sub:"잠시만 기다려주시면 결과로 이동합니다", countFmt: n => n + "초 후 결과 확인" },
  en: { title:"Calculating your fortune", sub:"You'll be redirected in a moment", countFmt: n => "Redirecting in " + n + "s" },
};
function showWaitScreenThenGo(targetUrl, seconds){
  seconds = seconds || 10;
  const lang = (localStorage.getItem("kf_lang") === "en") ? "en" : "kr";
  const L = WAIT_LABELS[lang];
  const modal = document.getElementById("waitModal");
  document.getElementById("waitTitle").textContent = L.title;
  document.getElementById("waitSub").textContent = L.sub;
  const bar = document.getElementById("waitBar");
  const countEl = document.getElementById("waitCount");
  modal.style.display = "flex";
  let remain = seconds;
  countEl.textContent = L.countFmt(remain);
  bar.style.width = "3%";
  setTimeout(() => { bar.style.width = "100%"; }, 50); /* 트랜지션 트리거 */
  const timer = setInterval(() => {
    remain -= 1;
    countEl.textContent = L.countFmt(Math.max(remain,0));
    if(remain <= 0){
      clearInterval(timer);
      location.href = targetUrl;
    }
  }, 1000);
}
</script>
